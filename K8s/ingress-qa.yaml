apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: qa
  annotations:
    # Rewrite the path to remove the prefix (e.g., /alpha/actuator/health -> /actuator/health)
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # No SSL redirect for QA
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: qa.microservices.local
      http:
        paths:
          # Alpha Service routes
          - path: /alpha(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: alpha-service
                port:
                  number: 80
          # Beta Service routes
          - path: /beta(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: beta-service
                port:
                  number: 80
          # Gamma Service routes
          - path: /gamma(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: gamma-service
                port:
                  number: 80
